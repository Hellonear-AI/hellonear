title: HelloNear Repeated Refused Payments From One Mind
id: 86314119-4130-4a4e-a7cb-8006006d464f
status: experimental
description: DRAFT. Five or more refused payments from one Mind in an hour. A Mind that keeps trying to pay past its policy may be following injected instructions from an email or a web page.
references:
    - T-02
author: HelloNear team
date: 2026-11-14
tags:
    - attack.impact
    - attack.t1657
correlation:
    type: event_count
    rules:
        - hellonear_payment_refused
    group-by:
        - mindId
    timespan: 1h
    condition:
        gte: 5
falsepositives:
    - The Attack playground, which tries refused payments on purpose
level: high
