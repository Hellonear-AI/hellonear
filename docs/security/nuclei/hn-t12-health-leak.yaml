id: hn-t12-health-leak
info:
  name: HelloNear - a public answer reveals internals
  author: hellonear-team
  severity: medium
  description: T-06/T-12. /v1/health, /v1/status and an error answer must not carry stack traces, file paths, env names or key prefixes.
  tags: hellonear,t12
http:
  - method: GET
    path:
      - "{{BaseURL}}/v1/health"
      - "{{BaseURL}}/v1/status"
      - "{{BaseURL}}/v1/does-not-exist"
    stop-at-first-match: true
    matchers:
      - type: regex
        part: body
        regex:
          - "(?i)(at [A-Za-z_.]+ \\(.*:[0-9]+:[0-9]+\\))"
          - "/opt/hellonear|/etc/hellonear|node_modules"
          - "(?i)(api[_-]?key|secret|password)\\s*[\"':=]"
          - "\\b(wk_|ak_|sk-)[A-Za-z0-9]{8,}"
          - "postgres(ql)?://"
