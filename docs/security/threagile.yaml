threagile_version: 1.0.0
title: HelloNear hosted demo
date: 2026-11-14
author:
  name: HelloNear team
  homepage: https://hellonear.xyz
management_summary_comment: Threat model of the hosted hackathon demo. Built from the repository (docs/openapi.json, deploy/README.md, apps/be/CLAUDE.md) and issue 327. Everything runs on NEAR testnet; no real money moves.
business_criticality: important
business_overview:
  description: 'HelloNear gives each owner a Mind: an AI assistant that reads email, works in apps and pays from its own wallet. Limits sit outside the model: owner approval and an OutLayer policy checked in a TEE.'
  images: []
technical_overview:
  description: Browser to Cloudflare to a Cloudflare Tunnel on a LAN host to one LXC container (web app, backend, engine, Postgres). The backend relays runs to the engine on loopback; the engine calls NEAR AI Cloud.
  images: []
questions:
  Is disk encryption on for the Proxmox node?: ''
  Who else on the LAN can reach SSH on the container?: ''
  Does the engine block private and loopback addresses in the http-request skill?: ''
abuse_cases:
  Credit exhaustion: An attacker creates free testnet accounts and starts runs until the shared NEAR AI credit or the daily cap is used up.
  Injected payment: An email or web page read by a Mind tells it to pay an attacker.
  Key theft: An attacker reads be.env or the database and decrypts wallet keys.
security_requirements:
  Limits outside the model: Every payment needs the owner approval or an owner rule, and the OutLayer policy is checked in a TEE.
  Internal routes on loopback only: cloudflared must not run inside the container.
  Secrets only in env files: Never in code, logs, issues or prompts.
tags_available: []
