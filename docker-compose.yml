# Local development services. Shared by apps/be and engine.
services:
  postgres:
    image: pgvector/pgvector:pg17
    # Kept small so laptops (OrbStack on macOS) stay cool: 1 CPU, 512 MB.
    cpus: 1.0
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: hellonear
      POSTGRES_PASSWORD: hellonear-dev-only
      POSTGRES_DB: hellonear
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellonear -d hellonear"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
