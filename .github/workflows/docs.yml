# Docs CI (Mintlify): docs.json and every page build, and no internal link or anchor is broken. No secrets.
name: docs

on:
  pull_request:
    paths: ['apps/docs/**', 'docs/openapi.json', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['apps/docs/**', 'docs/openapi.json', '.github/workflows/docs.yml']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mintlify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bunx mint@4.2.1184 validate
      - run: bunx mint@4.2.1184 broken-links --check-anchors
