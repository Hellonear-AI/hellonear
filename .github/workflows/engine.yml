# Engine CI: typecheck and unit tests. No secrets: the unit tests use fake backends and never call NEAR AI.
# The integration tests (`bun run test`) need a NEAR AI key, so they stay local.
name: engine

on:
  pull_request:
    paths: ['engine/**', '.github/workflows/engine.yml']
  push:
    branches: [main]
    paths: ['engine/**', '.github/workflows/engine.yml']

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:unit
