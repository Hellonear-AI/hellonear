# Landing page CI (#233 review): typecheck and a production build. No secrets needed; it has no lint script.
name: landing

on:
  pull_request:
    paths: ['apps/landing/**', '.github/workflows/landing.yml']
  push:
    branches: [main]
    paths: ['apps/landing/**', '.github/workflows/landing.yml']

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
