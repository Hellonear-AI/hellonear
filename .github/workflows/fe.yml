# Web app CI: lint, typecheck and a production build. No secrets needed.
name: fe

on:
  pull_request:
    paths: ['apps/fe/**', '.github/workflows/fe.yml']
  push:
    branches: [main]
    paths: ['apps/fe/**', '.github/workflows/fe.yml']

concurrency:
  group: fe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
